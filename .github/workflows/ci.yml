name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev dbus libgtk-4-dev libadwaita-1-dev
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install rclone
        # Ubuntu's package is too old for bisync --backup-dir1 (needs 1.66+).
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Test
        # A private session bus for the daemon's D-Bus test.
        run: dbus-run-session -- cargo test --workspace -- --include-ignored
