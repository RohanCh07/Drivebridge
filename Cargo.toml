[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/store",
    "crates/rclone",
    "crates/watcher",
    "crates/daemon",
    "crates/cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Rohan708/drivebridge"

[workspace.dependencies]
drivebridge-core = { path = "crates/core" }
clap = { version = "4", features = ["derive"] }
