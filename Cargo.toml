[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/store",
    "crates/rclone",
    "crates/watcher",
    "crates/daemon",
    "crates/cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Rohan708/drivebridge"

[workspace.dependencies]
drivebridge-core = { path = "crates/core" }
drivebridge-rclone = { path = "crates/rclone" }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"
ureq = "2"
