[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/store",
    "crates/rclone",
    "crates/engine",
    "crates/watcher",
    "crates/daemon",
    "crates/cli",
    "crates/gui",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-or-later"
repository = "https://github.com/Rohan708/drivebridge"

[workspace.dependencies]
drivebridge-core = { path = "crates/core" }
drivebridge-engine = { path = "crates/engine" }
drivebridge-rclone = { path = "crates/rclone" }
drivebridge-store = { path = "crates/store" }
drivebridge-watcher = { path = "crates/watcher" }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
getrandom = "0.2"
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
notify = "6"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"
zbus = "4"
ureq = { version = "2", default-features = false, features = ["json"] }
