# Flatpak build of the app, the background service and the CLI, with rclone bundled.
# See packaging/flatpak/README.md for how to build it.
app-id: io.github.Drivebridge.App
runtime: org.gnome.Platform
runtime-version: "46"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: drivebridge-gui
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The sync folder can be anywhere in the home folder.
  - --filesystem=home
  # The Google token lives in the user's keyring.
  - --talk-name=org.freedesktop.secrets
  # The background service's own D-Bus name, the tray and notifications.
  - --own-name=io.github.Drivebridge
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-*
  - --talk-name=org.freedesktop.Notifications
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: rclone
    buildsystem: simple
    build-commands:
      - install -Dm755 rclone /app/bin/rclone
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://downloads.rclone.org/v1.71.1/rclone-v1.71.1-linux-amd64.zip
        sha256: 417e3da236f3a12d292da4e7287d67b1df558b8c2b280d092e563958ed724be7
      - type: archive
        only-arches: [aarch64]
        url: https://downloads.rclone.org/v1.71.1/rclone-v1.71.1-linux-arm64.zip
        sha256: cd0eb0d6faf1fdb697f191a316bbc6552770fafa097baf326ce61c04ab89f783

  - name: drivebridge
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/drivebridge/cargo
        CARGO_NET_OFFLINE: "true"
    build-commands:
      - cargo --offline build --release --workspace
      - install -Dm755 -t /app/bin target/release/drivebridge-gui target/release/drivebridged target/release/drivebridge
      - install -Dm644 packaging/io.github.Drivebridge.App.desktop -t /app/share/applications
      - install -Dm644 packaging/io.github.Drivebridge.App.metainfo.xml -t /app/share/metainfo
      - install -Dm644 packaging/icons/io.github.Drivebridge.App.svg -t /app/share/icons/hicolor/scalable/apps
    sources:
      - type: dir
        path: ../..
      # Generated from Cargo.lock; see README.md next to this file.
      - cargo-sources.json
